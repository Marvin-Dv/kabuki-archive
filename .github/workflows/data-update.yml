name: Atualizar dados (PR automático)

# Roda todo dia e também manualmente (Actions → Run workflow), por exemplo no dia de um patch.
# Só abre PR se algo mudou em data/generated. Nada vai ao ar sem você dar merge.
#
# PRIMEIRA EXECUÇÃO: rode manualmente com `baseline` = a data de hoje (YYYY-MM-DD).
# Isso marca todo o conteúdo já existente como anunciado. Sem isso, nenhuma entidade
# tem `announcedAt` e nada é publicado (regra de embargo).
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Marcar entidades ainda não registradas como anunciadas nesta data (YYYY-MM-DD). Use só na primeira vez.'
        required: false
        default: ''
      only:
        description: 'Limita o baseline a estas coleções (ex.: materials). Use ao ingerir uma coleção nova, para não liberar personagens novos de carona.'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *' # diário, 08:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Buscar e normalizar dados
        env:
          BASELINE: ${{ inputs.baseline }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$BASELINE" ] && [ -n "$ONLY" ]; then
            pnpm data:fetch --baseline "$BASELINE" --only "$ONLY"
          elif [ -n "$BASELINE" ]; then
            pnpm data:fetch --baseline "$BASELINE"
          else
            pnpm data:fetch
          fi

      - name: Validar
        run: pnpm validate

      - name: Abrir Pull Request com o diff
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/data-update
          delete-branch: true
          commit-message: 'data: atualização automática'
          title: 'data: atualização automática'
          body: |
            Atualização gerada pelo workflow de ingestão.
            Revise o diff em `data/generated/` e faça o merge para publicar.

            Entidades novas sem data em `data/announcements.json` ficam com
            `announcedAt: null` e **não são publicadas** até você registrar o anúncio.
          labels: data
