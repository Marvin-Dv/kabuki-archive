name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild semanal: garante que os avisos de spoiler expirem no prazo de 14 dias,
  # já que o site é estático e só reavalia a data quando é gerado.
  schedule:
    - cron: '0 6 * * 1' # segundas, 06:00 UTC (03:00 em Brasília)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Troque por `pnpm install --frozen-lockfile` depois de commitar o pnpm-lock.yaml.
      - run: pnpm install --no-frozen-lockfile

      - name: Testes
        run: pnpm test

      - name: Validar dados
        run: pnpm validate

      - name: Gerar site estático
        run: pnpm generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
